name: Test and deploy GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            apps/chroma-jack/package-lock.json
            apps/text-erosion/package-lock.json
            apps/rain-on-glass/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix apps/chroma-jack
          npm ci --prefix apps/text-erosion
          npm ci --prefix apps/rain-on-glass

      - name: Check formatting
        run: npm run format:check --prefix apps/chroma-jack

      - name: Run lint
        run: npm run lint --prefix apps/chroma-jack

      - name: Run tests
        run: |
          npm test --prefix apps/chroma-jack
          npm test --prefix apps/text-erosion
          npm test --prefix apps/rain-on-glass

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: pages
        uses: actions/configure-pages@v5

      - name: Build applications
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path || '' }}
        run: |
          npm run build --prefix apps/chroma-jack -- --base "${PAGES_BASE_PATH}/chroma-jack/"
          npm run build --prefix apps/text-erosion -- --base "${PAGES_BASE_PATH}/text-erosion/"
          npm run build --prefix apps/rain-on-glass -- --base "${PAGES_BASE_PATH}/rain-on-glass/"

      - name: Assemble GitHub Pages site
        run: |
          mkdir -p _site/chroma-jack _site/text-erosion _site/rain-on-glass
          cp index.html _site/index.html
          cp -a apps/chroma-jack/dist/. _site/chroma-jack/
          cp -a apps/text-erosion/dist/. _site/text-erosion/
          cp -a apps/rain-on-glass/dist/. _site/rain-on-glass/

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
