<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="思いついたアイデアから生まれた、小さなWebアプリの一覧です。" />
    <title>Just Idea</title>
    <style>
      :root { font-family: system-ui, sans-serif; color: #253047; background: #f5f6fa; }
      body { max-width: 640px; margin: 64px auto; padding: 0 24px; }
      h1 { margin-bottom: 8px; }
      p { line-height: 1.7; }
      ul { display: grid; gap: 16px; padding: 0; list-style: none; margin-top: 32px; }
      a { display: block; padding: 24px; border: 1px solid #d8dce7; border-radius: 12px; background: white; color: #234eac; text-decoration: none; }
      a:hover { border-color: #234eac; }
      a:focus-visible { outline: 3px solid #234eac; outline-offset: 4px; }
      a span { display: block; margin-top: 8px; color: #48536a; line-height: 1.6; }
    </style>
  </head>
  <body>
    <main>
      <h1>Just Idea</h1>
      <p>思いついたアイデアを、小さなWebアプリに。</p>
      <ul>
        <li>
          <a href="./chroma-jack/">
            <strong>Chroma Jack</strong>
            <span>色の判断で白を目指す、1人用スコアアタック。</span>
          </a>
        </li>
        <li>
          <a href="./text-erosion/">
            <strong>文字風化シミュレーター</strong>
            <span>輪郭から文字が風化していく過程を観察。</span>
          </a>
        </li>
        <li>
          <a href="./rain-on-glass/">
            <strong>Rain on Glass</strong>
            <span>水滴が育ち、重なり、滑り落ちる。静かな雨の窓。</span>
          </a>
        </li>
      </ul>
    </main>
  </body>
</html>
